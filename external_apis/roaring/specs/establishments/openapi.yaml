{
  "openapi": "3.0.1",
  "paths": {
    "/{companyId}": {
      "get": {
        "operationId": "viewEstablishment",
        "parameters": [
          {
            "description": "id of company",
            "in": "path",
            "name": "companyId",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EstablishmentsResult"
                }
              }
            },
            "description": "OK, successfull response"
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BadRequest"
                }
              }
            },
            "description": "Returned when something is wrong in the request, e.g. too many entities are requested or arguments are missing"
          },
          "404": {
            "description": "Requested resource could not be found"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ServerError"
                }
              }
            },
            "description": "An internal server error occurred, please contact the system administrator with information on the error"
          }
        },
        "summary": "Get establishments from a single company",
        "tags": [
          "Establishments"
        ]
      }
    }
  },
  "security": [
    {
      "OAuth2": []
    }
  ],
  "servers": [
    {
      "url": "https://api.roaring.io/se/company/establishment/2.0"
    }
  ],
  "x-id": "Establishments",
  "components": {
    "schemas": {

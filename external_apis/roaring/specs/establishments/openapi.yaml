          "officeName": {
            "description": "Office name",
            "type": "string"
          },
          "officeType": {
            "description": "Office type",
            "type": "string"
          },
          "visitAddress": {
            "$ref": "#/components/schemas/Address"
          }
        },
        "type": "object"
      },
      "EstablishmentsResult": {
        "properties": {
          "changeDate": {
            "description": "Date for when the record was changed",
            "type": "string"
          },
          "companyId": {
            "description": "Company identifier (company registration number / organization number)",
            "type": "string"
          },
          "establishments": {
            "description": "Company establishments",
            "items": {
              "$ref": "#/components/schemas/Establishment"
            },
            "type": "array"
          },
          "status": {
            "$ref": "#/components/schemas/SearchResultStatus"
          }
        },
        "type": "object"
      },
      "Industry": {
        "properties": {
          "code": {

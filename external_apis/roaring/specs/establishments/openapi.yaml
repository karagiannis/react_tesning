  "info": {
    "description": "Shows a company's workplaces (geographical workplaces). You will receive information about workplace number (CFAR), workplace name, contact information, and postal and delivery address. Is used to keep track of a company's different Local Units and their postal and delivery addresses.",
    "title": "Establishments",
    "version": "2.0",
    "x-logo": {
      "url": "https://assets.roaring.io/svg/work-places-icon-v3.svg"
    }
  },
  "x-category": "company",
  "x-countries": [
    "se"
  ]

          },
          "coAddress": {
            "description": "Postal address, C/O address",
            "type": "string"
          },
          "commune": {
            "description": "Postal address, commune name",
            "type": "string"
          },
          "communeCode": {
            "description": "Postal address, commune code",
            "type": "string"
          },
          "region": {
            "description": "Postal address, region name",
            "type": "string"
          },
          "regionCode": {
            "description": "Postal address, region code",
            "type": "string"
          },
          "town": {
            "description": "Postal address, town",
            "type": "string"
          },
          "zipCode": {
            "description": "Postal address, zipcode",
            "type": "string"
          }
        },
        "type": "object"
      },
      "BadRequest": {
        "description": "Returned when something is wrong in the request, e.g. failed argument validation or missed argument",
        "properties": {
          "attributes": {
            "description": "Invalid attributes",
            "items": {
              "$ref": "#/components/schemas/RequestAttribute"
            },
            "type": "array"
          },
          "error": {
            "description": "Error name",
            "type": "string"
          },
          "message": {
            "description": "Description of the request error",
            "type": "string"
          }
        },
        "type": "object"
      },
      "Contact": {
        "properties": {
          "email": {
            "description": "Email address",
            "type": "string"
          },
          "faxNumber": {
            "description": "Fax number",
            "type": "string"
          },
          "phoneNumber": {
            "description": "Telephone number",
            "type": "string"
          }
        },
        "type": "object"
      },
      "Establishment": {
        "properties": {
          "address": {
            "$ref": "#/components/schemas/Address"
          },
          "commercialBlockText": {
            "description": "Commercial block text",
            "type": "string"
          },
          "companyEstablishmentNumber": {
            "description": "Company establishment number",
            "type": "string"
          },
          "contact": {
            "$ref": "#/components/schemas/Contact"
          },
          "industry": {
            "$ref": "#/components/schemas/Industry"
          },
          "numberEmployeesInterval": {
